name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Write project files
        run: |
          mkdir -p $(dirname settings.gradle)
          cat > settings.gradle << 'EOF'
          pluginManagement {
          repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
          repositories { google(); mavenCentral() }
          }
          rootProject.name = 'ClassicLudo'
          include ':app'
          EOF
          mkdir -p $(dirname build.gradle)
          cat > build.gradle << 'EOF'
          plugins {
          id 'com.android.application' version '8.5.2' apply false
          id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          echo 'org.gradle.jvmargs=-Xmx3g' > gradle.properties
          mkdir -p $(dirname app/build.gradle)
          cat > app/build.gradle << 'EOF'
          plugins {
          id 'com.android.application'
          id 'org.jetbrains.kotlin.android'
          }
          android {
          namespace 'com.md.classicludo'
          compileSdk 34
          defaultConfig {
          applicationId 'com.md.classicludo'
          minSdk 26
          targetSdk 34
          versionCode 1
          versionName '1.0'
          }
          compileOptions {
          sourceCompatibility JavaVersion.VERSION_17
          targetCompatibility JavaVersion.VERSION_17
          }
          kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
          implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.INTERNET" />
          <application android:label="Classic Ludo" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen">
          <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
          <intent-filter>
          <action android:name="android.intent.action.MAIN" />
          <category android:name="android.intent.category.LAUNCHER" />
          </intent-filter>
          </activity>
          </application>
          </manifest>
          EOF
          mkdir -p $(dirname app/src/main/java/com/md/classicludo/MainActivity.kt)
          cat > app/src/main/java/com/md/classicludo/MainActivity.kt << 'EOF'
          package com.md.classicludo
          import android.app.Activity
          import android.graphics.Color
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.Toast
          import okhttp3.*
          import org.json.JSONObject
          import java.util.concurrent.TimeUnit
          class MainActivity : Activity() {
          val SERVER = "wss://classicludopvp.onrender.com"
          val ui = Handler(Looper.getMainLooper())
          val http = OkHttpClient.Builder().connectTimeout(70, TimeUnit.SECONDS).pingInterval(25, TimeUnit.SECONDS).build()
          var ws: WebSocket? = null
          var isOpen = false
          var gen = 0
          var pending: (() -> Unit)? = null
          lateinit var root: FrameLayout
          var screen = "splash"
          var mode = 0
          var you = -1
          var code = ""
          val colors = ArrayList<Int>()
          var agreedCount = 0
          var agreedSelf = false
          var waitText: android.widget.TextView? = null
          var game: GameView? = null
          override fun onCreate(b: Bundle?) {
          super.onCreate(b)
          window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
          window.statusBarColor = Color.BLACK
          window.navigationBarColor = Color.BLACK
          root = FrameLayout(this)
          root.setBackgroundColor(Color.BLACK)
          setContentView(root)
          showSplash()
          ui.postDelayed({ if (screen == "splash") showMode() }, 10000)
          }
          fun send(t: String, vararg kv: Pair<String, Any>) {
          val o = JSONObject().put("t", t)
          for ((k, v) in kv) o.put(k, v)
          ws?.send(o.toString())
          }
          fun connect(then: () -> Unit) {
          if (isOpen) { then(); return }
          pending = then
          if (ws != null) return
          val g = ++gen
          ws = http.newWebSocket(Request.Builder().url(SERVER).build(), object : WebSocketListener() {
          override fun onOpen(w: WebSocket, r: Response) {
          ui.post {
          if (g == gen) {
          isOpen = true
          val p = pending
          pending = null
          p?.invoke()
          }
          }
          }
          override fun onMessage(w: WebSocket, text: String) {
          try {
          val m = JSONObject(text)
          ui.post { if (g == gen) onMsg(m) }
          } catch (e: Exception) {}
          }
          override fun onClosed(w: WebSocket, c: Int, reason: String) { dropped(g) }
          override fun onFailure(w: WebSocket, t: Throwable, r: Response?) { dropped(g) }
          })
          }
          fun dropped(g: Int) {
          ui.post {
          if (g != gen) return@post
          ws = null
          isOpen = false
          pending = null
          if (screen != "mode" && screen != "splash") {
          
          Toast.makeText(this, "Connection lost / 接続が切れました", Toast.LENGTH_LONG).show()
          showMode()
          }
          }
          }
          fun onMsg(m: JSONObject) {
          when (m.optString("t")) {
          "room" -> {
          code = m.getString("code")
          mode = m.getInt("mode")
          you = m.getInt("you")
          val a = m.getJSONArray("players")
          colors.clear()
          var ag = 0
          for (i in 0 until a.length()) {
          val o = a.getJSONObject(i)
          colors.add(o.getInt("color"))
          if (o.getBoolean("agreed")) ag++
          }
          agreedCount = ag
          if (m.getBoolean("started")) return
          if (colors.size < mode) {
          agreedSelf = false
          if (screen != "wait") showWait() else updateWait()
          } else if (screen != "terms") {
          agreedSelf = false
          showTerms()
          } else updateWait()
          }
          "state" -> {
          if (screen != "game") showGame()
          game?.update(m)
          }
          "end" -> {
          Toast.makeText(this, "A player left the match / 相手が退出しました", Toast.LENGTH_LONG).show()
          showMode()
          }
          }
          }
          override fun onBackPressed() {
          when (screen) {
          "splash" -> {}
          "mode" -> finish()
          else -> showMode()
          }
          }
          override fun onDestroy() {
          gen++
          ws?.close(1000, null)
          super.onDestroy()
          }
          }
          EOF
          mkdir -p $(dirname app/src/main/java/com/md/classicludo/Screens.kt)
          cat > app/src/main/java/com/md/classicludo/Screens.kt << 'EOF'
          package com.md.classicludo
          import android.content.Context
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.text.SpannableString
          import android.text.Spanned
          import android.text.style.ForegroundColorSpan
          import android.text.style.RelativeSizeSpan
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          fun MainActivity.dp(v: Int) = (v * resources.displayMetrics.density).toInt()
          fun MainActivity.setScreen(name: String, v: View, bg: Boolean) {
          screen = name
          if (name != "game") game = null
          root.removeAllViews()
          if (bg) {
          val b = ImageView(this)
          b.setImageResource(R.drawable.bg)
          b.scaleType = ImageView.ScaleType.CENTER_CROP
          root.addView(b, FrameLayout.LayoutParams(-1, -1))
          }
          root.addView(v, FrameLayout.LayoutParams(-1, -1))
          }
          fun MainActivity.showSplash() {
          val v = ImageView(this)
          v.setImageResource(R.drawable.splash)
          v.scaleType = ImageView.ScaleType.CENTER_CROP
          setScreen("splash", v, false)
          }
          fun MainActivity.showMode() {
          send("leave")
          mode = 0
          val col = LinearLayout(this)
          col.orientation = LinearLayout.VERTICAL
          col.gravity = Gravity.CENTER
          col.setPadding(dp(20), dp(20), dp(20), dp(20))
          val t = TextView(this)
          t.text = "Classic LUDO"
          t.setTextColor(Color.WHITE)
          t.textSize = 32f
          t.typeface = Typeface.DEFAULT_BOLD
          t.gravity = Gravity.CENTER
          t.setPadding(0, 0, 0, dp(24))
          col.addView(t)
          val names = arrayOf("DUO", "TRIPLE", "SQUAD")
          for (i in 0..2) {
          val card = ModeCard(this, i + 2, names[i])
          card.setOnClickListener { startFind(i + 2) }
          val lp = LinearLayout.LayoutParams(-1, dp(150))
          lp.setMargins(0, dp(10), 0, dp(10))
          col.addView(card, lp)
          }
          setScreen("mode", col, true)
          }
          fun MainActivity.startFind(n: Int) {
          mode = n
          colors.clear()
          code = ""
          agreedSelf = false
          showWait()
          connect { send("find", "mode" to n) }
          }
          fun MainActivity.showWait() {
          val col = LinearLayout(this)
          col.orientation = LinearLayout.VERTICAL
          col.gravity = Gravity.CENTER
          col.setPadding(dp(24), dp(24), dp(24), dp(24))
          val tv = TextView(this)
          tv.setTextColor(Color.WHITE)
          tv.textSize = 24f
          tv.typeface = Typeface.DEFAULT_BOLD
          tv.gravity = Gravity.CENTER
          waitText = tv
          val cancel = Button(this)
          cancel.text = "Cancel"
          cancel.setOnClickListener { showMode() }
          col.addView(tv)
          col.addView(cancel, LinearLayout.LayoutParams(dp(200), -2))
          setScreen("wait", col, true)
          updateWait()
          }
          fun MainActivity.updateWait() {
          val t = waitText ?: return
          if (screen == "wait") {
          t.text = if (code.isEmpty()) "Connecting...\n(first time may take about 1 minute)\n接続中…"
          else "MATCH NO\n$code\n\nFinding players… ${colors.size}/$mode"
          } else if (screen == "terms") {
          t.text = "他のプレイヤーを待っています… ($agreedCount/$mode)\nWaiting for other players…"
          }
          }
          fun MainActivity.rowText(jp: String, en: String): TextView {
          val s = SpannableString(jp + "\n" + en)
          s.setSpan(RelativeSizeSpan(0.62f), jp.length + 1, s.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
          s.setSpan(ForegroundColorSpan(Color.parseColor("#C8D7F0")), jp.length + 1, s.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
          val t = TextView(this)
          t.text = s
          t.setTextColor(Color.WHITE)
          t.textSize = 19f
          t.typeface = Typeface.DEFAULT_BOLD
          t.setPadding(dp(16), dp(14), dp(12), dp(14))
          val bg = GradientDrawable()
          bg.setColor(Color.parseColor("#CC081646"))
          bg.cornerRadius = dp(18).toFloat()
          bg.setStroke(dp(2), Color.parseColor("#AAFFFFFF"))
          t.background = bg
          return t
          
          }
          fun MainActivity.showTerms() {
          val col = LinearLayout(this)
          col.orientation = LinearLayout.VERTICAL
          col.setPadding(dp(16), dp(36), dp(16), dp(36))
          val title = TextView(this)
          title.text = "利用規約"
          title.setTextColor(Color.WHITE)
          title.textSize = 32f
          title.typeface = Typeface.DEFAULT_BOLD
          title.gravity = Gravity.CENTER
          title.setPadding(0, 0, 0, dp(24))
          col.addView(title)
          val ticks = ArrayList<Tick>()
          val btn = Button(this)
          btn.text = "続ける"
          btn.textSize = 22f
          btn.isAllCaps = false
          val waiting = TextView(this)
          waiting.setTextColor(Color.WHITE)
          waiting.textSize = 20f
          waiting.gravity = Gravity.CENTER
          waiting.visibility = View.GONE
          waitText = waiting
          fun refresh() {
          val ok = ticks.size == 2 && ticks.all { it.on }
          btn.isEnabled = ok
          val g = GradientDrawable()
          g.cornerRadius = dp(18).toFloat()
          g.setColor(Color.parseColor(if (ok) "#2F7BE0" else "#6B7280"))
          btn.background = g
          btn.setTextColor(if (ok) Color.WHITE else Color.parseColor("#B9BEC8"))
          }
          val items = arrayOf(
          arrayOf("このゲームでは、サイコロの目が操作される場合があります。", "In this game, the dice results may be manipulated."),
          arrayOf("お金や賞品を賭けることは固く禁止されています。", "Betting money or prizes is strictly prohibited.")
          )
          for (it2 in items) {
          val row = LinearLayout(this)
          row.orientation = LinearLayout.HORIZONTAL
          row.gravity = Gravity.CENTER_VERTICAL
          row.addView(rowText(it2[0], it2[1]), LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
          val tk = Tick(this) { refresh() }
          ticks.add(tk)
          val lp = LinearLayout.LayoutParams(dp(46), dp(46))
          lp.setMargins(dp(10), 0, 0, 0)
          row.addView(tk, lp)
          val rl = LinearLayout.LayoutParams(-1, -2)
          rl.setMargins(0, 0, 0, dp(16))
          col.addView(row, rl)
          }
          col.addView(View(this), LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))
          btn.setOnClickListener {
          agreedSelf = true
          send("agree")
          btn.visibility = View.GONE
          waiting.visibility = View.VISIBLE
          for (t in ticks) t.isClickable = false
          updateWait()
          }
          col.addView(btn, LinearLayout.LayoutParams(-1, dp(64)))
          col.addView(waiting, LinearLayout.LayoutParams(-1, dp(80)))
          setScreen("terms", col, true)
          refresh()
          }
          fun MainActivity.showGame() {
          val g = GameView(this, { send("roll") }, { i -> send("move", "tok" to i) }, { showMode() })
          g.you = you
          g.code = code
          for (c in colors) g.present[c] = true
          setScreen("game", g, true)
          game = g
          }
          class Tick(c: Context, val onChange: () -> Unit) : View(c) {
          var on = false
          val p = Paint(Paint.ANTI_ALIAS_FLAG)
          init {
          setOnClickListener {
          on = !on
          invalidate()
          onChange()
          }
          }
          override fun onDraw(cv: Canvas) {
          val w = width.toFloat()
          val h = height.toFloat()
          p.style = Paint.Style.FILL
          p.color = Color.parseColor("#EE0A1946")
          cv.drawRoundRect(RectF(4f, 4f, w - 4f, h - 4f), 10f, 10f, p)
          p.style = Paint.Style.STROKE
          p.strokeWidth = 6f
          p.color = Color.WHITE
          cv.drawRoundRect(RectF(4f, 4f, w - 4f, h - 4f), 10f, 10f, p)
          if (on) {
          p.color = Color.parseColor("#50E678")
          p.strokeWidth = 10f
          p.strokeCap = Paint.Cap.ROUND
          cv.drawLine(w * 0.22f, h * 0.52f, w * 0.42f, h * 0.74f, p)
          cv.drawLine(w * 0.42f, h * 0.74f, w * 0.80f, h * 0.28f, p)
          }
          }
          }
          class ModeCard(c: Context, val n: Int, val label: String) : View(c) {
          val p = Paint(Paint.ANTI_ALIAS_FLAG)
          val hair = intArrayOf(0xFFFF5733.toInt(), 0xFF3CC85A.toInt(), 0xFF7B52FF.toInt(), 0xFF2A2A2A.toInt())
          val body = intArrayOf(0xFF3AA0FF.toInt(), 0xFFFF78B4.toInt(), 0xFFFFC72A.toInt(), 0xFFF03C3C.toInt())
          init { isClickable = true }
          override fun onDraw(cv: Canvas) {
          val w = width.toFloat()
          val h = height.toFloat()
          p.style = Paint.Style.FILL
          p.color = 0xE0142856.toInt()
          cv.drawRoundRect(RectF(3f, 3f, w - 3f, h - 3f), 28f, 28f, p)
          p.style = Paint.Style.STROKE
          p.strokeWidth = 5f
          p.color = Color.WHITE
          cv.drawRoundRect(RectF(3f, 3f, w - 3f, h - 3f), 28f, 28f, p)
          val slot = (w - 40f) / 4f
          val startX = (w - slot * n) / 2f
          for (i in 0 until n) {
          val cx = startX + slot * (i + 0.5f)
          val cy = h * 0.36f
          val r = h * 0.17f
          p.style = Paint.Style.FILL
          p.color = body[i]
          cv.drawRoundRect(RectF(cx - r * 0.9f, cy + r * 0.8f, cx + r * 0.9f, cy + r * 2.1f), 12f, 12f, p)
          p.color = 0xFFFFD2A8.toInt()
          cv.drawCircle(cx, cy, r, p)
          p.color = hair[i]
          cv.drawArc(RectF(cx - r * 1.05f, cy - r * 1.05f, cx + r * 1.05f, cy + r * 1.05f), 180f, 180f, true, p)
          p.color = Color.BLACK
          cv.drawCircle(cx - r * 0.35f, cy + r * 0.15f, r * 0.1f, p)
          cv.drawCircle(cx + r * 0.35f, cy + r * 0.15f, r * 0.1f, p)
          }
          p.style = Paint.Style.FILL
          p.color = 0xFFFFE62E.toInt()
          p.textSize = h * 0.2f
          p.typeface = Typeface.DEFAULT_BOLD
          p.textAlign = Paint.Align.CENTER
          cv.drawText(label, w / 2f, h * 0.93f, p)
          }
          }
          EOF
          mkdir -p $(dirname app/src/main/java/com/md/classicludo/GameView.kt)
          cat > app/src/main/java/com/md/classicludo/GameView.kt << 'EOF'
          package com.md.classicludo
          import android.content.Context
          import android.graphics.*
          import android.os.SystemClock
          import android.view.MotionEvent
          import android.view.View
          import org.json.JSONObject
          class GameView(c: Context, val onRoll: () -> Unit, val onMove: (Int) -> Unit, val onExit: () -> Unit) : View(c) {
          val COL = intArrayOf(0xFFE81C24.toInt(), 0xFF0A9A3E.toInt(), 0xFFFFD91E.toInt(), 0xFF1E9FE5.toInt())
          val NAME = arrayOf("Red 赤", "Green 緑", "Yellow 黄", "Blue 青")
          val SEAT = intArrayOf(2, 3, 4, 1)
          var tokens = Array(4) { IntArray(4) }
          var present = BooleanArray(4)
          var turn = -1
          var phase = "roll"
          var dice = 0
          
