name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Write project files
        run: |
          mkdir -p $(dirname settings.gradle)
          cat > settings.gradle << 'EOF'
          pluginManagement {
          repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
          repositories { google(); mavenCentral() }
          }
          rootProject.name = 'ClassicLudo'
          include ':app'
          EOF
          mkdir -p $(dirname build.gradle)
          cat > build.gradle << 'EOF'
          plugins {
          id 'com.android.application' version '8.5.2' apply false
          id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          echo 'org.gradle.jvmargs=-Xmx3g' > gradle.properties
          mkdir -p $(dirname app/build.gradle)
          cat > app/build.gradle << 'EOF'
          plugins {
          id 'com.android.application'
          id 'org.jetbrains.kotlin.android'
          }
          android {
          namespace 'com.md.classicludo'
          compileSdk 34
          defaultConfig {
          applicationId 'com.md.classicludo'
          minSdk 26
          targetSdk 34
          versionCode 1
          versionName '1.0'
          }
          compileOptions {
          sourceCompatibility JavaVersion.VERSION_17
          targetCompatibility JavaVersion.VERSION_17
          }
          kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
          implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.INTERNET" />
          <application android:label="Classic Ludo" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen">
          <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
          <intent-filter>
          <action android:name="android.intent.action.MAIN" />
          <category android:name="android.intent.category.LAUNCHER" />
          </intent-filter>
          </activity>
          </application>
          </manifest>
          EOF
          mkdir -p $(dirname app/src/main/java/com/md/classicludo/MainActivity.kt)
          cat > app/src/main/java/com/md/classicludo/MainActivity.kt << 'EOF'
          package com.md.classicludo
          import android.app.Activity
          import android.graphics.Color
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.Toast
          import okhttp3.*
          import org.json.JSONObject
          import java.util.concurrent.TimeUnit
          class MainActivity : Activity() {
          val SERVER = "wss://classicludopvp.onrender.com"
          val ui = Handler(Looper.getMainLooper())
          val http = OkHttpClient.Builder().connectTimeout(70, TimeUnit.SECONDS).pingInterval(25, TimeUnit.SECONDS).build()
          var ws: WebSocket? = null
          var isOpen = false
          var gen = 0
          var pending: (() -> Unit)? = null
          lateinit var root: FrameLayout
          var screen = "splash"
          var mode = 0
          var you = -1
          var code = ""
          val colors = ArrayList<Int>()
          var agreedCount = 0
          var agreedSelf = false
          var waitText: android.widget.TextView? = null
          var game: GameView? = null
          override fun onCreate(b: Bundle?) {
          super.onCreate(b)
          window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
          window.statusBarColor = Color.BLACK
          window.navigationBarColor = Color.BLACK
          root = FrameLayout(this)
          root.setBackgroundColor(Color.BLACK)
          setContentView(root)
          showSplash()
          ui.postDelayed({ if (screen == "splash") showMode() }, 10000)
          }
          fun send(t: String, vararg kv: Pair<String, Any>) {
          val o = JSONObject().put("t", t)
          for ((k, v) in kv) o.put(k, v)
          ws?.send(o.toString())
          }
          fun connect(then: () -> Unit) {
          if (isOpen) { then(); return }
          pending = then
          if (ws != null) return
          val g = ++gen
          ws = http.newWebSocket(Request.Builder().url(SERVER).build(), object : WebSocketListener() {
          override fun onOpen(w: WebSocket, r: Response) {
          ui.post {
          if (g == gen) {
          isOpen = true
          val p = pending
          pending = null
          p?.invoke()
          }
          }
          }
          override fun onMessage(w: WebSocket, text: String) {
          try {
          val m = JSONObject(text)
          ui.post { if (g == gen) onMsg(m) }
          } catch (e: Exception) {}
          }
          override fun onClosed(w: WebSocket, c: Int, reason: String) { dropped(g) }
          override fun onFailure(w: WebSocket, t: Throwable, r: Response?) { dropped(g) }
          })
          }
          fun dropped(g: Int) {
          ui.post {
          if (g != gen) return@post
          ws = null
          isOpen = false
          pending = null
          if (screen != "mode" && screen != "splash") {
          
          Toast.makeText(this, "Connection lost / 接続が切れました", Toast.LENGTH_LONG).show()
          showMode()
          }
          }
          }
          fun onMsg(m: JSONObject) {
          when (m.optString("t")) {
          "room" -> {
          code = m.getString("code")
          mode = m.getInt("mode")
          you = m.getInt("you")
          val a = m.getJSONArray("players")
          colors.clear()
          var ag = 0
          for (i in 0 until a.length()) {
          val o = a.getJSONObject(i)
          colors.add(o.getInt("color"))
          if (o.getBoolean("agreed")) ag++
          }
          agreedCount = ag
          if (m.getBoolean("started")) return
          if (colors.size < mode) {
          agreedSelf = false
          if (screen != "wait") showWait() else updateWait()
          } else if (screen != "terms") {
          agreedSelf = false
          showTerms()
          } else updateWait()
          }
          "state" -> {
          if (screen != "game") showGame()
          game?.update(m)
          }
          "end" -> {
          Toast.makeText(this, "A player left the match / 相手が退出しました", Toast.LENGTH_LONG).show()
          showMode()
          }
          }
          }
          override fun onBackPressed() {
          when (screen) {
          "splash" -> {}
          "mode" -> finish()
          else -> showMode()
          }
          }
          override fun onDestroy() {
          gen++
          ws?.close(1000, null)
          super.onDestroy()
          }
          }
          EOF
          mkdir -p $(dirname app/src/main/java/com/md/classicludo/Screens.kt)
          cat > app/src/main/java/com/md/classicludo/Screens.kt << 'EOF'
          package com.md.classicludo
          import android.content.Context
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.text.SpannableString
          import android.text.Spanned
          import android.text.style.ForegroundColorSpan
          import android.text.style.RelativeSizeSpan
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          fun MainActivity.dp(v: Int) = (v * resources.displayMetrics.density).toInt()
          fun MainActivity.setScreen(name: String, v: View, bg: Boolean) {
          screen = name
          if (name != "game") game = null
          root.removeAllViews()
          if (bg) {
          val b = ImageView(this)
          b.setImageResource(R.drawable.bg)
          b.scaleType = ImageView.ScaleType.CENTER_CROP
          root.addView(b, FrameLayout.LayoutParams(-1, -1))
          }
          root.addView(v, FrameLayout.LayoutParams(-1, -1))
          }
          fun MainActivity.showSplash() {
          val v = ImageView(this)
          v.setImageResource(R.drawable.splash)
          v.scaleType = ImageView.ScaleType.CENTER_CROP
          setScreen("splash", v, false)
          }
          fun MainActivity.showMode() {
          send("leave")
          mode = 0
          val col = LinearLayout(this)
          col.orientation = LinearLayout.VERTICAL
          col.gravity = Gravity.CENTER
          col.setPadding(dp(20), dp(20), dp(20), dp(20))
          val t = TextView(this)
          t.text = "Classic LUDO"
          t.setTextColor(Color.WHITE)
          t.textSize = 32f
          t.typeface = Typeface.DEFAULT_BOLD
          t.gravity = Gravity.CENTER
          t.setPadding(0, 0, 0, dp(24))
          col.addView(t)
          val names = arrayOf("DUO", "TRIPLE", "SQUAD")
          for (i in 0..2) {
          val card = ModeCard(this, i + 2, names[i])
          card.setOnClickListener { startFind(i + 2) }
          val lp = LinearLayout.LayoutParams(-1, dp(150))
          lp.setMargins(0, dp(10), 0, dp(10))
          col.addView(card, lp)
          }
          setScreen("mode", col, true)
          }
          fun MainActivity.startFind(n: Int) {
          mode = n
          colors.clear()
          code = ""
          agreedSelf = false
          showWait()
          connect { send("find", "mode" to n) }
          }
          fun MainActivity.showWait() {
          val col = LinearLayout(this)
          col.orientation = LinearLayout.VERTICAL
          col.gravity = Gravity.CENTER
          col.setPadding(dp(24), dp(24), dp(24), dp(24))
          val tv = TextView(this)
          tv.setTextColor(Color.WHITE)
          tv.textSize = 24f
          tv.typeface = Typeface.DEFAULT_BOLD
          tv.gravity = Gravity.CENTER
          waitText = tv
          val cancel = Button(this)
          cancel.text = "Cancel"
          cancel.setOnClickListener { showMode() }
          col.addView(tv)
          col.addView(cancel, LinearLayout.LayoutParams(dp(200), -2))
          setScreen("wait", col, true)
          updateWait()
          }
          fun MainActivity.updateWait() {
          val t = waitText ?: return
          if (screen == "wait") {
          t.text = if (code.isEmpty()) "Connecting...\n(first time may take about 1 minute)\n接続中…"
          else "MATCH NO\n$code\n\nFinding players… ${colors.size}/$mode"
          } else if (screen == "terms") {
          t.text = "他のプレイヤーを待っています… ($agreedCount/$mode)\nWaiting for other players…"
          }
          }
          fun MainActivity.rowText(jp: String, en: String): TextView {
          val s = SpannableString(jp + "\n" + en)
          s.setSpan(RelativeSizeSpan(0.62f), jp.length + 1, s.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
          s.setSpan(ForegroundColorSpan(Color.parseColor("#C8D7F0")), jp.length + 1, s.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
          val t = TextView(this)
          t.text = s
          t.setTextColor(Color.WHITE)
          t.textSize = 19f
          t.typeface = Typeface.DEFAULT_BOLD
          t.setPadding(dp(16), dp(14), dp(12), dp(14))
          val bg = GradientDrawable()
          bg.setColor(Color.parseColor("#CC081646"))
          bg.cornerRadius = dp(18).toFloat()
          bg.setStroke(dp(2), Color.parseColor("#AAFFFFFF"))
          t.background = bg
          return t
          
          }
          fun MainActivity.showTerms() {
          val col = LinearLayout(this)
          col.orientation = LinearLayout.VERTICAL
          col.setPadding(dp(16), dp(36), dp(16), dp(36))
          val title = TextView(this)
          title.text = "利用規約"
          title.setTextColor(Color.WHITE)
          title.textSize = 32f
          title.typeface = Typeface.DEFAULT_BOLD
          title.gravity = Gravity.CENTER
          title.setPadding(0, 0, 0, dp(24))
          col.addView(title)
          val ticks = ArrayList<Tick>()
          val btn = Button(this)
          btn.text = "続ける"
          btn.textSize = 22f
          btn.isAllCaps = false
          val waiting = TextView(this)
          waiting.setTextColor(Color.WHITE)
          waiting.textSize = 20f
          waiting.gravity = Gravity.CENTER
          waiting.visibility = View.GONE
          waitText = waiting
          fun refresh() {
          val ok = ticks.size == 2 && ticks.all { it.on }
          btn.isEnabled = ok
          val g = GradientDrawable()
          g.cornerRadius = dp(18).toFloat()
          g.setColor(Color.parseColor(if (ok) "#2F7BE0" else "#6B7280"))
          btn.background = g
          btn.setTextColor(if (ok) Color.WHITE else Color.parseColor("#B9BEC8"))
          }
          val items = arrayOf(
          arrayOf("このゲームでは、サイコロの目が操作される場合があります。", "In this game, the dice results may be manipulated."),
          arrayOf("お金や賞品を賭けることは固く禁止されています。", "Betting money or prizes is strictly prohibited.")
          )
          for (it2 in items) {
          val row = LinearLayout(this)
          row.orientation = LinearLayout.HORIZONTAL
          row.gravity = Gravity.CENTER_VERTICAL
          row.addView(rowText(it2[0], it2[1]), LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
          val tk = Tick(this) { refresh() }
          ticks.add(tk)
          val lp = LinearLayout.LayoutParams(dp(46), dp(46))
          lp.setMargins(dp(10), 0, 0, 0)
          row.addView(tk, lp)
          val rl = LinearLayout.LayoutParams(-1, -2)
          rl.setMargins(0, 0, 0, dp(16))
          col.addView(row, rl)
          }
          col.addView(View(this), LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))
          btn.setOnClickListener {
          agreedSelf = true
          send("agree")
          btn.visibility = View.GONE
          waiting.visibility = View.VISIBLE
          for (t in ticks) t.isClickable = false
          updateWait()
          }
          col.addView(btn, LinearLayout.LayoutParams(-1, dp(64)))
          col.addView(waiting, LinearLayout.LayoutParams(-1, dp(80)))
          setScreen("terms", col, true)
          refresh()
          }
          fun MainActivity.showGame() {
          val g = GameView(this, { send("roll") }, { i -> send("move", "tok" to i) }, { showMode() })
          g.you = you
          g.code = code
          for (c in colors) g.present[c] = true
          setScreen("game", g, true)
          game = g
          }
          class Tick(c: Context, val onChange: () -> Unit) : View(c) {
          var on = false
          val p = Paint(Paint.ANTI_ALIAS_FLAG)
          init {
          setOnClickListener {
          on = !on
          invalidate()
          onChange()
          }
          }
          override fun onDraw(cv: Canvas) {
          val w = width.toFloat()
          val h = height.toFloat()
          p.style = Paint.Style.FILL
          p.color = Color.parseColor("#EE0A1946")
          cv.drawRoundRect(RectF(4f, 4f, w - 4f, h - 4f), 10f, 10f, p)
          p.style = Paint.Style.STROKE
          p.strokeWidth = 6f
          p.color = Color.WHITE
          cv.drawRoundRect(RectF(4f, 4f, w - 4f, h - 4f), 10f, 10f, p)
          if (on) {
          p.color = Color.parseColor("#50E678")
          p.strokeWidth = 10f
          p.strokeCap = Paint.Cap.ROUND
          cv.drawLine(w * 0.22f, h * 0.52f, w * 0.42f, h * 0.74f, p)
          cv.drawLine(w * 0.42f, h * 0.74f, w * 0.80f, h * 0.28f, p)
          }
          }
          }
          class ModeCard(c: Context, val n: Int, val label: String) : View(c) {
          val p = Paint(Paint.ANTI_ALIAS_FLAG)
          val hair = intArrayOf(0xFFFF5733.toInt(), 0xFF3CC85A.toInt(), 0xFF7B52FF.toInt(), 0xFF2A2A2A.toInt())
          val body = intArrayOf(0xFF3AA0FF.toInt(), 0xFFFF78B4.toInt(), 0xFFFFC72A.toInt(), 0xFFF03C3C.toInt())
          init { isClickable = true }
          override fun onDraw(cv: Canvas) {
          val w = width.toFloat()
          val h = height.toFloat()
          p.style = Paint.Style.FILL
          p.color = 0xE0142856.toInt()
          cv.drawRoundRect(RectF(3f, 3f, w - 3f, h - 3f), 28f, 28f, p)
          p.style = Paint.Style.STROKE
          p.strokeWidth = 5f
          p.color = Color.WHITE
          cv.drawRoundRect(RectF(3f, 3f, w - 3f, h - 3f), 28f, 28f, p)
          val slot = (w - 40f) / 4f
          val startX = (w - slot * n) / 2f
          for (i in 0 until n) {
          val cx = startX + slot * (i + 0.5f)
          val cy = h * 0.36f
          val r = h * 0.17f
          p.style = Paint.Style.FILL
          p.color = body[i]
          cv.drawRoundRect(RectF(cx - r * 0.9f, cy + r * 0.8f, cx + r * 0.9f, cy + r * 2.1f), 12f, 12f, p)
          p.color = 0xFFFFD2A8.toInt()
          cv.drawCircle(cx, cy, r, p)
          p.color = hair[i]
          cv.drawArc(RectF(cx - r * 1.05f, cy - r * 1.05f, cx + r * 1.05f, cy + r * 1.05f), 180f, 180f, true, p)
          p.color = Color.BLACK
          cv.drawCircle(cx - r * 0.35f, cy + r * 0.15f, r * 0.1f, p)
          cv.drawCircle(cx + r * 0.35f, cy + r * 0.15f, r * 0.1f, p)
          }
          p.style = Paint.Style.FILL
          p.color = 0xFFFFE62E.toInt()
          p.textSize = h * 0.2f
          p.typeface = Typeface.DEFAULT_BOLD
          p.textAlign = Paint.Align.CENTER
          cv.drawText(label, w / 2f, h * 0.93f, p)
          }
          }
          EOF
          mkdir -p $(dirname app/src/main/java/com/md/classicludo/GameView.kt)
          cat > app/src/main/java/com/md/classicludo/GameView.kt << 'EOF'
          package com.md.classicludo
          import android.content.Context
          import android.graphics.*
          import android.os.SystemClock
          import android.view.MotionEvent
          import android.view.View
          import org.json.JSONObject
          class GameView(c: Context, val onRoll: () -> Unit, val onMove: (Int) -> Unit, val onExit: () -> Unit) : View(c) {
          val COL = intArrayOf(0xFFE81C24.toInt(), 0xFF0A9A3E.toInt(), 0xFFFFD91E.toInt(), 0xFF1E9FE5.toInt())
          val NAME = arrayOf("Red 赤", "Green 緑", "Yellow 黄", "Blue 青")
          val SEAT = intArrayOf(2, 3, 4, 1)
          var tokens = Array(4) { IntArray(4) }
          var present = BooleanArray(4)
          var turn = -1
          var phase = "roll"
          var dice = 0
          
          var legal = IntArray(0)
          var winner = -1
          var you = 0
          var code = ""
          var note = ""
          var busy = false
          var rollUntil = 0L
          val last = IntArray(4)
          val p = Paint(Paint.ANTI_ALIAS_FLAG)
          var bl = 0f
          var bt = 0f
          var cs = 0f
          val yo = arrayOf(floatArrayOf(0f, 0f), floatArrayOf(0f, 9f), floatArrayOf(9f, 9f), floatArrayOf(9f, 0f))
          val slot = arrayOf(floatArrayOf(1.9f, 1.9f), floatArrayOf(1.9f, 4.1f), floatArrayOf(4.1f, 1.9f), floatArrayOf(4.1f, 4.1f))
          val PIPS = arrayOf(
          intArrayOf(), intArrayOf(0, 0), intArrayOf(-1, -1, 1, 1), intArrayOf(-1, -1, 0, 0, 1, 1),
          intArrayOf(-1, -1, 1, -1, -1, 1, 1, 1), intArrayOf(-1, -1, 1, -1, 0, 0, -1, 1, 1, 1),
          intArrayOf(-1, -1, -1, 0, -1, 1, 1, -1, 1, 0, 1, 1)
          )
          val trk: Array<IntArray> = buildTrack()
          fun buildTrack(): Array<IntArray> {
          val l = ArrayList<IntArray>()
          for (c in 1..5) l.add(intArrayOf(6, c))
          for (r in 5 downTo 0) l.add(intArrayOf(r, 6))
          l.add(intArrayOf(0, 7))
          l.add(intArrayOf(0, 8))
          for (r in 1..5) l.add(intArrayOf(r, 8))
          for (c in 9..14) l.add(intArrayOf(6, c))
          l.add(intArrayOf(7, 14))
          l.add(intArrayOf(8, 14))
          for (c in 13 downTo 9) l.add(intArrayOf(8, c))
          for (r in 9..14) l.add(intArrayOf(r, 8))
          l.add(intArrayOf(14, 7))
          l.add(intArrayOf(14, 6))
          for (r in 13 downTo 9) l.add(intArrayOf(r, 6))
          for (c in 5 downTo 0) l.add(intArrayOf(8, c))
          l.add(intArrayOf(7, 0))
          l.add(intArrayOf(6, 0))
          return l.toTypedArray()
          }
          fun x(col: Float) = bl + col * cs
          fun y(row: Float) = bt + row * cs
          fun cell(color: Int, i: Int, pos: Int): FloatArray {
          if (pos == 0) {
          val o = yo[color]
          val s = slot[i]
          return floatArrayOf(o[1] + s[1], o[0] + s[0])
          }
          if (pos <= 51) {
          val t = trk[(color * 13 + pos - 1) % 52]
          return floatArrayOf(t[1] + 0.5f, t[0] + 0.5f)
          }
          if (pos <= 56) {
          val k = pos - 51
          return when (color) {
          0 -> floatArrayOf(k + 0.5f, 7.5f)
          1 -> floatArrayOf(7.5f, k + 0.5f)
          2 -> floatArrayOf(14.5f - k, 7.5f)
          else -> floatArrayOf(7.5f, 14.5f - k)
          }
          }
          val d = (i - 1.5f) * 0.22f
          return when (color) {
          0 -> floatArrayOf(6.85f, 7.5f + d)
          1 -> floatArrayOf(7.5f + d, 6.85f)
          2 -> floatArrayOf(8.15f, 7.5f + d)
          else -> floatArrayOf(7.5f + d, 8.15f)
          }
          }
          fun dicePos(k: Int): FloatArray {
          val top = bt - cs * 2.4f
          val bot = bt + cs * 15f + cs * 2.4f
          val left = bl + cs * 2.4f
          val right = bl + cs * 15f - cs * 2.4f
          return when (k) {
          0 -> floatArrayOf(left, top)
          1 -> floatArrayOf(right, top)
          2 -> floatArrayOf(right, bot)
          else -> floatArrayOf(left, bot)
          }
          }
          fun update(m: JSONObject) {
          val t = m.getJSONObject("tokens")
          for (k in 0..3) {
          val a = t.optJSONArray(k.toString())
          if (a != null) for (i in 0..3) tokens[k][i] = a.getInt(i)
          }
          turn = m.getInt("turn")
          phase = m.getString("phase")
          dice = m.getInt("dice")
          val lg = m.getJSONArray("legal")
          legal = IntArray(lg.length()) { lg.getInt(it) }
          winner = if (m.isNull("winner")) -1 else m.getInt("winner")
          note = m.optString("note")
          if (dice > 0 && turn >= 0) {
          last[turn] = dice
          rollUntil = SystemClock.uptimeMillis() + 600
          }
          busy = false
          invalidate()
          }
          fun box(cv: Canvas, c0: Float, r0: Float, c1: Float, r1: Float, fill: Int) {
          val rc = RectF(x(c0), y(r0), x(c1), y(r1))
          p.style = Paint.Style.FILL
          p.color = fill
          cv.drawRect(rc, p)
          p.style = Paint.Style.STROKE
          p.strokeWidth = 2f
          p.color = 0xFF9AA3B5.toInt()
          cv.drawRect(rc, p)
          }
          fun pin(cv: Canvas, px: Float, py: Float, color: Int, r: Float) {
          p.style = Paint.Style.FILL
          p.color = Color.argb(70, 0, 0, 0)
          cv.drawOval(RectF(px - r * 0.8f, py + r * 0.5f, px + r * 0.8f, py + r * 1.0f), p)
          val path = Path()
          path.moveTo(px, py + r * 0.95f)
          path.lineTo(px - r * 0.62f, py - r * 0.1f)
          path.lineTo(px + r * 0.62f, py - r * 0.1f)
          path.close()
          p.color = Color.WHITE
          cv.drawPath(path, p)
          cv.drawCircle(px, py - r * 0.35f, r * 0.72f, p)
          p.color = color
          cv.drawCircle(px, py - r * 0.35f, r * 0.52f, p)
          p.color = Color.argb(120, 255, 255, 255)
          cv.drawCircle(px - r * 0.15f, py - r * 0.5f, r * 0.15f, p)
          }
          fun text(cv: Canvas, s: String, cx: Float, cy: Float, size: Float, color: Int) {
          p.style = Paint.Style.FILL
          p.textAlign = Paint.Align.CENTER
          p.typeface = Typeface.DEFAULT_BOLD
          p.textSize = size
          p.color = color
          var yy = cy
          for (line in s.split("\n")) {
          cv.drawText(line, cx, yy, p)
          yy += size * 1.25f
          }
          }
          fun drawDice(cv: Canvas, k: Int) {
          val d = dicePos(k)
          val hs = cs * 1.15f
          val act = turn == k && winner < 0
          p.style = Paint.Style.FILL
          p.color = 0xE0142856.toInt()
          cv.drawRoundRect(RectF(d[0] - hs, d[1] - hs, d[0] + hs, d[1] + hs), hs * 0.3f, hs * 0.3f, p)
          p.style = Paint.Style.STROKE
          p.strokeWidth = if (act) 8f else 3f
          p.color = if (act) 0xFFFFE62E.toInt() else COL[k]
          cv.drawRoundRect(RectF(d[0] - hs, d[1] - hs, d[0] + hs, d[1] + hs), hs * 0.3f, hs * 0.3f, p)
          val fs = hs * 0.62f
          p.style = Paint.Style.FILL
          p.color = if (act) Color.WHITE else 0xFFF0D8D8.toInt()
          cv.drawRoundRect(RectF(d[0] - fs, d[1] - fs, d[0] + fs, d[1] + fs), fs * 0.3f, fs * 0.3f, p)
          val now = SystemClock.uptimeMillis()
          val v = if (act && now < rollUntil) 1 + ((now / 70) % 6).toInt() else last[k]
          if (v in 1..6) {
          p.color = Color.BLACK
          val a = PIPS[v]
          var i = 0
          while (i < a.size) {
          
          cv.drawCircle(d[0] + a[i] * fs * 0.55f, d[1] + a[i + 1] * fs * 0.55f, fs * 0.16f, p)
          i += 2
          }
          }
          }
          override fun onDraw(cv: Canvas) {
          val w = width.toFloat()
          val h = height.toFloat()
          val bs = w * 0.96f
          cs = bs / 15f
          bl = (w - bs) / 2f
          bt = (h - bs) / 2f
          for (k in 0..3) {
          val o = yo[k]
          box(cv, o[1], o[0], o[1] + 6f, o[0] + 6f, COL[k])
          box(cv, o[1] + 0.9f, o[0] + 0.9f, o[1] + 5.1f, o[0] + 5.1f, Color.WHITE)
          for (i in 0..3) {
          val c = cell(k, i, 0)
          p.style = Paint.Style.FILL
          p.color = Color.argb(90, Color.red(COL[k]), Color.green(COL[k]), Color.blue(COL[k]))
          cv.drawCircle(x(c[0]), y(c[1]), cs * 0.62f, p)
          }
          }
          for (k in 0 until 52) {
          val t = trk[k]
          box(cv, t[1].toFloat(), t[0].toFloat(), t[1] + 1f, t[0] + 1f, if (k % 13 == 0) COL[k / 13] else Color.WHITE)
          if (k % 13 == 8) text(cv, "★", x(t[1] + 0.5f), y(t[0] + 0.5f) + cs * 0.25f, cs * 0.7f, 0xFF8A93A6.toInt())
          }
          for (k in 0..3) for (j in 1..5) {
          val c = cell(k, 0, 51 + j)
          box(cv, c[0] - 0.5f, c[1] - 0.5f, c[0] + 0.5f, c[1] + 0.5f, COL[k])
          }
          val tri = arrayOf(
          floatArrayOf(6f, 6f, 6f, 9f), floatArrayOf(6f, 6f, 9f, 6f),
          floatArrayOf(9f, 6f, 9f, 9f), floatArrayOf(6f, 9f, 9f, 9f)
          )
          for (k in 0..3) {
          val a = tri[k]
          val path = Path()
          path.moveTo(x(a[0]), y(a[1]))
          path.lineTo(x(a[2]), y(a[3]))
          path.lineTo(x(7.5f), y(7.5f))
          path.close()
          p.style = Paint.Style.FILL
          p.color = COL[k]
          cv.drawPath(path, p)
          }
          for (k in 0..3) if (present[k]) {
          val o = yo[k]
          val ry = if (k < 2) o[0] + 0.62f else o[0] + 5.72f
          text(cv, if (k == you) "You あなた" else "Player " + SEAT[k], x(o[1] + 3f), y(ry), cs * 0.5f, Color.WHITE)
          drawDice(cv, k)
          }
          var anim = SystemClock.uptimeMillis() < rollUntil
          val cnt = HashMap<String, Int>()
          val r = cs * 0.62f
          for (k in 0..3) if (present[k]) for (i in 0..3) {
          val pos = tokens[k][i]
          val c = cell(k, i, pos)
          val key = "" + (c[0] * 10).toInt() + "_" + (c[1] * 10).toInt()
          val n = cnt[key] ?: 0
          cnt[key] = n + 1
          val off = if (pos == 0 || pos == 57) 0f else n * cs * 0.2f
          val px = x(c[0]) + off
          val py = y(c[1]) - off * 0.5f + cs * 0.15f
          val hl = phase == "move" && turn == you && k == you && legal.contains(i) && winner < 0
          if (hl) {
          anim = true
          p.style = Paint.Style.STROKE
          p.strokeWidth = 5f
          p.color = Color.argb(120 + ((SystemClock.uptimeMillis() / 4) % 120).toInt(), 255, 230, 40)
          cv.drawCircle(px, py - r * 0.35f, r * 1.05f, p)
          }
          pin(cv, px, py, COL[k], r)
          }
          p.style = Paint.Style.FILL
          p.color = 0xE0142856.toInt()
          val mb = RectF(cs * 0.5f, cs * 0.8f, cs * 5.2f, cs * 3.0f)
          cv.drawRoundRect(mb, 20f, 20f, p)
          p.style = Paint.Style.STROKE
          p.strokeWidth = 4f
          p.color = 0xFFFFE62E.toInt()
          cv.drawRoundRect(mb, 20f, 20f, p)
          text(cv, "MATCH NO", cs * 2.85f, cs * 1.55f, cs * 0.5f, Color.WHITE)
          text(cv, code, cs * 2.85f, cs * 2.55f, cs * 0.85f, 0xFFFFE62E.toInt())
          val st = status()
          val sy = Math.min(bt + cs * 15f + cs * 5.2f, h - cs * 2.2f)
          text(cv, st, w / 2f, sy, cs * 0.62f, Color.WHITE)
          val nt = noteText()
          if (nt.isNotEmpty()) text(cv, nt, w / 2f, bt - cs * 4.6f, cs * 0.7f, 0xFFFFE62E.toInt())
          if (winner >= 0) {
          p.style = Paint.Style.FILL
          p.color = 0xAA000000.toInt()
          cv.drawRect(0f, 0f, w, h, p)
          val msg = if (winner == you) "You win! あなたの勝ち" else NAME[winner] + " wins!"
          text(cv, msg, w / 2f, h / 2f, cs * 1.1f, Color.WHITE)
          text(cv, "Tap to exit / タップして終了", w / 2f, h / 2f + cs * 2f, cs * 0.6f, 0xFFFFE62E.toInt())
          }
          if (anim) postInvalidateDelayed(60)
          }
          fun status(): String {
          if (winner >= 0 || turn < 0) return ""
          val nm = NAME[turn]
          return if (turn == you) {
          when (phase) {
          "roll" -> "あなたの番: サイコロをタップ\nYour turn: tap the dice"
          "move" -> "駒を選んでください\nChoose a token"
          else -> "動かせる駒なし / No move"
          }
          } else "$nm の番を待っています\nWaiting for $nm"
          }
          fun noteText(): String = when (note) {
          "three6" -> "6が3回連続: 番が飛びます\nThree 6s: turn lost"
          "capture" -> "取った! / Captured!"
          "bonus" -> "もう一度! / Roll again!"
          else -> ""
          }
          fun lock(f: () -> Unit) {
          busy = true
          postDelayed({ busy = false }, 1500)
          f()
          }
          override fun onTouchEvent(e: MotionEvent): Boolean {
          if (e.action != MotionEvent.ACTION_UP) return true
          if (winner >= 0) {
          onExit()
          return true
          }
          if (turn != you || busy) return true
          if (phase == "roll") {
          val d = dicePos(you)
          if (Math.abs(e.x - d[0]) < cs * 2.4f && Math.abs(e.y - d[1]) < cs * 2.4f) lock { onRoll() }
          } else if (phase == "move") {
          for (i in legal) {
          val c = cell(you, i, tokens[you][i])
          val dx = e.x - x(c[0])
          val dy = e.y - y(c[1])
          if (dx * dx + dy * dy < cs * cs * 1.4f) {
          lock { onMove(i) }
          break
          }
          }
          }
          return true
          }
          }
          EOF
      - name: Add assets and signing key
        run: |
          mkdir -p app/src/main/res/drawable-nodpi app/src/main/res/mipmap-xxxhdpi ~/.android
          cp splash.jpg app/src/main/res/drawable-nodpi/splash.jpg
          cp bg.jpg app/src/main/res/drawable-nodpi/bg.jpg
          cp logo.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo '' | base64 -d > ~/.android/debug.keystore
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Classic Ludo v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          
