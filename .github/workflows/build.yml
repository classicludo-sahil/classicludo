name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Write project files
        run: |
          mkdir -p $(dirname settings.gradle)
          cat > settings.gradle << 'EOF'
          pluginManagement {
          repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
          repositories { google(); mavenCentral() }
          }
          rootProject.name = 'ClassicLudo'
          include ':app'
          EOF
          mkdir -p $(dirname build.gradle)
          cat > build.gradle << 'EOF'
          plugins {
          id 'com.android.application' version '8.5.2' apply false
          id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          echo 'org.gradle.jvmargs=-Xmx3g' > gradle.properties
          mkdir -p $(dirname app/build.gradle)
          cat > app/build.gradle << 'EOF'
          plugins {
          id 'com.android.application'
          id 'org.jetbrains.kotlin.android'
          }
          android {
          namespace 'com.md.classicludo'
          compileSdk 34
          defaultConfig {
          applicationId 'com.md.classicludo'
          minSdk 26
          targetSdk 34
          versionCode 1
          versionName '1.0'
          }
          compileOptions {
          sourceCompatibility JavaVersion.VERSION_17
          targetCompatibility JavaVersion.VERSION_17
          }
          kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
          implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.INTERNET" />
          <application android:label="Classic Ludo" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen">
          <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
          <intent-filter>
          <action android:name="android.intent.action.MAIN" />
          <category android:name="android.intent.category.LAUNCHER" />
          </intent-filter>
          </activity>
          </application>
          </manifest>
          EOF
          mkdir -p $(dirname app/src/main/java/com/md/classicludo/MainActivity.kt)
          cat > app/src/main/java/com/md/classicludo/MainActivity.kt << 'EOF'
